<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de conexión</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f4f8;
    }
    button {
      font-size: 1.2rem;
      padding: 0.8rem 1.6rem;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    #mensaje { margin-top: 1.5rem; font-size: 2rem; font-weight: bold; min-height: 2.5rem; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <h1>Prueba de conexión</h1>
  <button id="btn">Saludar</button>
  <div id="mensaje"></div>

  <script>
    const btn = document.getElementById('btn');
    const mensaje = document.getElementById('mensaje');

    btn.addEventListener('click', async () => {
      mensaje.className = '';
      mensaje.textContent = 'Conectando...';
      try {
        const res = await fetch('/api/saludo');
        const data = await res.json();
        mensaje.textContent = data.mensaje;
      } catch (err) {
        mensaje.className = 'error';
        mensaje.textContent = 'No hay conexión con el servidor';
      }
    });
  </script>
</body>
</html>
